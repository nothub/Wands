name: 'Wands'
version: '@mod_version@'
api-version: '@minecraft_version@'
main: 'lol.hub.wands.Plugin'
description: 'Utility wands without client mods'
website: 'https://github.com/nothub/wands'
authors: [ 'nothub' ]
contributors: [ ]

commands:
  wand:
    description: 'Give a wand'
    usage: '/wand <type>'
    permission: wands.toggle

permissions:
  wands.toggle:
    default: true
